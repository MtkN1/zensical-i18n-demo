name: Documentation
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      # Installs the Python version from .python-version and the locked
      # dev dependencies (zensical, translate-toolkit) on `uv sync`.
      # setup-uv publishes no major-version tags (since v8): pin the release.
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      # Missing or outdated translations fall back to the source text, so
      # report them without blocking the deployment.
      - name: Check translations
        run: uv run i18n check
        continue-on-error: true
      # Builds site/ (English) and site/<lang>/ for every translated language.
      - run: uv run i18n build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
